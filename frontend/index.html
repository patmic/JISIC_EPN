<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XIII JISIC 2026 — La IA transformando el mundo en...</title>
<link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#070807;
  --bg-2:#0b0d0a;
  --ink:#f4f6f1;
  --ink-dim:#8b918a;
  --ink-faint:#4a4f49;
  --lime:#9dff32;
  --lime-soft:#6fd21a;
  --line:rgba(255,255,255,.10);

  --font:"Plus Jakarta Sans", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;

  --r-pill:999px;
  --field-h:clamp(37px,4vw,54px);
  --submit:clamp(27px,3vw,40px);
  --shadow-field:0 26px 60px -22px rgba(0,0,0,.72);
}

*{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html{scroll-behavior:auto}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
}

.ascent{
  position:relative;
  height:620vh;
  background:var(--bg);
}
.ascent__sticky{
  position:sticky;
  top:0;
  height:100vh;
  overflow:hidden;
  isolation:isolate;
}

.bloom{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}
.neuro{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.ascent__sticky::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%),
    radial-gradient(60% 55% at 38% 50%, rgba(7,8,7,.92) 0%, rgba(7,8,7,.55) 55%, transparent 100%),
    linear-gradient(90deg, var(--bg) 0%, rgba(7,8,7,.94) 26%, rgba(7,8,7,.62) 48%, transparent 72%);
}

.topbar{
  position:absolute;
  z-index:6;
  left:clamp(20px,17.5vw,272px);
  right:clamp(24px,8vw,120px);
  top:clamp(18px,5.5vh,60px);
  max-width:770px;
}
.topbar__nav{
  display:flex;
  align-items:center;
  width:fit-content;
  gap:3px;
  padding:5px;
  border-radius:var(--r-pill);
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
}
.topbar__nav a{
  font-family:var(--font);
  font-size:clamp(13px,1.05vw,17px);
  line-height:1.4;
  font-weight:500;
  letter-spacing:-.006em;
  color:var(--ink-dim);
  text-decoration:none;
  border-radius:var(--r-pill);
  padding:clamp(6px,.68vw,10px) clamp(14px,2vw,30px);
  white-space:nowrap;
  transition:color .2s ease, background .2s ease, box-shadow .2s ease;
}
.topbar__nav a:hover{color:var(--ink)}
.topbar__nav a[aria-current="page"]{
  color:#0c1206;
  background:var(--lime);
  box-shadow:0 6px 18px -8px rgba(157,255,50,.8);
}
.segmented{
  display:inline-flex;
  gap:3px;
  padding:5px;
  border-radius:var(--r-pill);
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
}
.segmented__item{
  font-family:var(--font);
  font-size:clamp(15px,1.05vw,19px);
  line-height:1.4;
  font-weight:500;
  letter-spacing:-.006em;
  color:var(--ink-dim);
  background:transparent;
  border:0;
  border-radius:var(--r-pill);
  padding:clamp(8px,.85vw,13px) clamp(14px,2vw,30px);
  cursor:pointer;
  white-space:nowrap;
  transition:color .2s ease, background .2s ease, box-shadow .2s ease;
}
.segmented__item:hover{color:var(--ink)}
.segmented__item[aria-selected="true"]{
  color:#0c1206;
  background:var(--lime);
  box-shadow:0 6px 18px -8px rgba(157,255,50,.8);
}
.segmented__item:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.searchfield{
  display:none;
  position:relative;
  align-items:center;
  gap:clamp(8px,.9vw,14px);
  margin-top:clamp(12px,1.6vh,20px);
  height:var(--field-h);
  padding:11px 11px 11px clamp(16px,1.6vw,24px);
  border-radius:var(--r-pill);
  background:rgba(10,13,9,.72);
  border:1px solid var(--line);
  box-shadow:var(--shadow-field);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.searchfield:focus-within{
  border-color:rgba(157,255,50,.45);
  box-shadow:var(--shadow-field), 0 0 0 3px rgba(157,255,50,.14);
}
.searchfield__icon{
  flex:none;
  width:clamp(18px,1.5vw,22px);
  height:clamp(18px,1.5vw,22px);
  color:var(--ink-faint);
  transition:color .2s ease;
}
.searchfield:focus-within .searchfield__icon{color:var(--lime)}
.searchfield__input{
  flex:1 1 auto;
  min-width:0;
  font-family:var(--font);
  font-size:clamp(16px,1.3vw,23px);
  line-height:1.4;
  font-weight:400;
  color:var(--ink);
  background:transparent;
  border:0;
  outline:none;
  padding:0;
}
.searchfield__input::placeholder{color:var(--ink-faint)}
.searchfield__input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchfield__submit{
  flex:none;
  width:var(--submit);
  height:var(--submit);
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid rgba(157,255,50,.35);
  background:var(--lime);
  color:#0c1206;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.searchfield__submit svg{width:calc(var(--submit) * .39);height:calc(var(--submit) * .39)}
.searchfield__submit:hover{transform:translateX(2px);box-shadow:0 10px 26px -10px rgba(157,255,50,.9)}
.searchfield__submit:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.searchfield__submit:disabled{opacity:.4;cursor:not-allowed;transform:none}

.topbar__hint{
  margin:clamp(9px,1.3vh,14px) 0 0;
  font:500 13px/1.4 var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.topbar__hint b{color:var(--lime);font-weight:500}
.topbar__hint.is-empty b{color:#ff8b6b}

.spine{
  position:absolute;
  left:clamp(14px,3.6vw,58px);
  top:50%;
  transform:translateY(-50%);
  height:76vh;
  width:140px;
  z-index:5;
  cursor:grab;
  touch-action:none;
  outline:none;
}
.spine.is-drag{cursor:grabbing}
.spine:focus-visible .node{
  box-shadow:0 0 0 3px rgba(157,255,50,.35), 0 0 0 7px rgba(157,255,50,.12), 0 0 30px rgba(157,255,50,.7);
}
.spine__rail{
  position:absolute;
  inset:0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 4%,#000 96%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 4%,#000 96%,transparent 100%);
}
.spine__track{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:1px;
  background:var(--line);
}
.spine__fill{
  position:absolute;
  right:0;
  top:0;
  width:1px;
  height:0;
  background:linear-gradient(180deg,rgba(157,255,50,.15),var(--lime));
  box-shadow:0 0 12px rgba(157,255,50,.6);
}
.month{
  position:absolute;
  right:24px;
  transform:translateY(-50%);
  white-space:nowrap;
  font:500 13px/1.4 var(--mono);
  letter-spacing:.14em;
  color:var(--ink-faint);
  transition:color .3s ease, opacity .3s ease;
  pointer-events:none;
}
.month.is-active{color:var(--ink)}
.month.is-past{color:var(--ink-dim)}
.tick{
  position:absolute;
  right:-2px;
  width:5px;height:5px;
  margin-top:-2.5px;
  border-radius:50%;
  background:#1b1f19;
  border:1px solid rgba(255,255,255,.16);
  pointer-events:none;
  transition:background .3s ease, border-color .3s ease;
}
.tick.is-lit{background:rgba(157,255,50,.55);border-color:rgba(157,255,50,.7)}

.evt{
  position:absolute;
  right:-5px;
  width:11px;height:11px;
  margin-top:-5.5px;
  transform:rotate(45deg);
  background:rgba(10,14,8,.9);
  border:1px solid color-mix(in srgb,var(--cat,#9dff32) 70%,transparent);
  transition:background .25s ease, box-shadow .25s ease, border-color .25s ease, opacity .25s ease;
}
.evt.is-done{border-color:rgba(255,255,255,.2);opacity:.45}
.evt.is-muted{opacity:.12}
.evt.is-active{
  background:var(--cat,var(--lime));
  border-color:var(--cat,var(--lime));
  box-shadow:0 0 14px var(--cat,var(--lime));
  opacity:1;
}
.evt__tip{
  position:absolute;
  left:-8px;
  top:50%;
  transform:translate(-100%,-50%) rotate(-45deg);
  transform-origin:100% 50%;
  white-space:nowrap;
  font:500 12px/1 var(--mono);
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink);
  background:rgba(9,12,8,.94);
  border:1px solid rgba(157,255,50,.3);
  border-radius:4px;
  padding:5px 8px;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.evt:hover .evt__tip{opacity:1}

.pagept{
  position:absolute;
  right:-3px;
  width:9px;height:9px;
  margin-top:-4.5px;
  border-radius:50%;
  background:rgba(10,14,8,.9);
  border:1px solid rgba(157,255,50,.55);
  transition:background .25s ease, box-shadow .25s ease, border-color .25s ease, transform .18s ease;
}
.pagept:hover{transform:scale(1.25)}
.pagept.is-active{
  background:var(--lime);
  border-color:var(--lime);
  box-shadow:0 0 14px rgba(157,255,50,.95);
}
.pagept__tip{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  white-space:nowrap;
  font:500 12px/1 var(--mono);
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink);
  background:rgba(9,12,8,.94);
  border:1px solid rgba(157,255,50,.3);
  border-radius:4px;
  padding:5px 8px;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.pagept:hover .pagept__tip{opacity:1}
.pagept__lbl{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  white-space:nowrap;
  font:500 13px/1.4 var(--mono);
  letter-spacing:.14em;
  color:var(--ink-dim);
  pointer-events:none;
  transition:color .3s ease;
}
.pagept.is-active .pagept__lbl{color:var(--ink)}
.pagept--lbl .pagept__tip{display:none}

.today{
  position:absolute;
  left:0;
  right:-12px;
  height:1px;
  z-index:4;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px);
  pointer-events:none;
}
.today::before{
  content:"";
  position:absolute;
  right:9px;
  top:-2.5px;
  width:6px;height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
}
.today::after{
  content:"HOY";
  position:absolute;
  left:0;
  top:-13px;
  font:600 11px/1 var(--mono);
  letter-spacing:.2em;
  color:rgba(255,255,255,.6);
}

.node{
  position:absolute;
  right:-16px;
  width:33px;height:33px;
  margin-top:-16.5px;
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(10,14,8,.92);
  border:1px solid var(--lime);
  box-shadow:0 0 0 5px rgba(157,255,50,.10), 0 0 26px rgba(157,255,50,.55);
  z-index:3;
  pointer-events:none;
  transition:transform .18s ease, box-shadow .18s ease;
}
.spine.is-drag .node{
  transform:scale(1.12);
  box-shadow:0 0 0 8px rgba(157,255,50,.13), 0 0 38px rgba(157,255,50,.8);
}
.node img{
  display:block;
  width:20px;
  height:20px;
  object-fit:contain;
}
.node__grip{
  position:absolute;
  left:-13px;
  width:5px;height:15px;
  border-left:1px solid rgba(157,255,50,.5);
  border-right:1px solid rgba(157,255,50,.5);
  opacity:.75;
}
.halo{
  position:absolute;
  right:-107px;
  width:248px;height:248px;
  margin-top:-124px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle, rgba(157,255,50,.26) 0%, rgba(157,255,50,.07) 38%, transparent 68%);
  z-index:1;
}

.site-foot{
  position:absolute;
  z-index:5;
  left:clamp(14px,3.6vw,58px);
  bottom:clamp(10px,2.6vh,26px);
  display:flex;
  align-items:center;
  gap:clamp(10px,1.4vw,20px);
  font:500 clamp(12px,.9vw,14px)/1.35 var(--font);
  color:var(--ink);
}
.site-foot a{color:inherit;text-decoration:none;transition:color .2s ease}
.site-foot a:hover{color:var(--lime)}
.site-foot__sep{width:1px;height:clamp(28px,3vw,40px);background:var(--line)}
.site-foot__logo{display:flex;align-items:center;gap:10px;opacity:.92}
.site-foot__logo:hover{opacity:1}
.site-foot__logo img{height:clamp(30px,3.4vw,46px);width:auto;display:block}
.site-foot__logo span{font-weight:600;letter-spacing:.04em}
.site-foot__txt{color:var(--ink-dim)}
.site-foot__txt a{color:var(--ink)}
.site-foot__txt a:hover{color:var(--lime)}

.scrim{
  position:absolute;
  left:0;right:0;bottom:0;
  height:56vh;
  z-index:2;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(180deg,transparent 0%,rgba(7,8,7,.86) 38%,var(--bg) 76%);
}

.stage{
  position:absolute;
  z-index:4;
  left:clamp(20px,17.5vw,272px);
  right:clamp(24px,8vw,120px);
  top:57%;
  transform:translateY(-50%);
  max-width:660px;
}
.stage.is-idle .stage__title,
.stage.is-idle .stage__body,
.stage.is-idle .meta{opacity:.42}
.stage.is-embed > .stage__title,
.stage.is-embed > .stage__body,
.stage.is-embed > .meta{display:none}
.stage__page{animation:riseIn .5s cubic-bezier(.16,.9,.3,1) both}
.stage__page .stage__title{margin:0 0 12px}
.stage.is-embed{max-width:none}
.stage__page .stage__body{max-width:90ch}
.countdown{
  position:absolute;
  top:0;right:0;
  display:flex;
  gap:clamp(8px,1vw,14px);
}
.countdown[hidden]{display:none}
.countdown__box{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:clamp(64px,7vw,104px);
  padding:clamp(10px,1.2vw,16px) clamp(8px,1vw,14px) clamp(8px,1vw,12px);
  border-radius:16px;
  background:rgba(0,0,0,.38);
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
}
.countdown__box b{
  font:600 clamp(32px,4vw,58px)/1 var(--font);
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.countdown__box span{
  margin-top:6px;
  font:600 clamp(13px,1vw,16px)/1 var(--font);
  color:var(--ink-dim);
}
.stage.is-page .countdown,
.stage.is-idle .countdown{display:none}
.stage.is-page .chip,
.stage.is-page .counter{display:none}
.stage__head{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  margin:0 0 16px;
}
.stage__eyebrow{
  margin:0;
  font:500 13px/1.4 var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--lime);
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:6px 12px;
  border:1px solid rgba(157,255,50,.28);
  border-radius:999px;
  background:rgba(157,255,50,.06);
}
.chip{
  font:500 12px/1.4 var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-dim);
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
}
.chip.is-soon{color:var(--lime);border-color:rgba(157,255,50,.3)}
.stage__title{
  margin:0 0 12px;
  font-size:clamp(32px,4vw,56px);
  line-height:1.04;
  letter-spacing:-.028em;
  font-weight:500;
}
.stage__body{
  margin:0 0 20px;
  max-width:44ch;
  color:var(--ink-dim);
  font-size:19px;
  line-height:1.55;
  font-weight:400;
}
.meta{
  margin:0 0 28px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 26px;
  font:400 16px/1.4 var(--mono);
  letter-spacing:.02em;
  color:var(--ink-faint);
}
.meta b{display:block;color:var(--ink-dim);font-weight:400}
.meta span{font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.reveal{display:block;overflow:hidden}
.reveal > span{display:block}
.swap-in > span{animation:riseIn .55s cubic-bezier(.16,.9,.3,1) both}
.stage__title.swap-in > span{animation-delay:.02s}
.stage__body.swap-in > span{animation-delay:.08s}
@keyframes riseIn{from{transform:translateY(105%);opacity:0}to{transform:translateY(0);opacity:1}}

.counter{
  display:flex;
  align-items:flex-end;
  gap:1px;
  font:600 clamp(21px,3.2vw,38px)/1 var(--font);
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 34px rgba(157,255,50,.18);
  margin-bottom:22px;
}
.slot{
  position:relative;
  display:inline-block;
  perspective:420px;
  min-width:.62em;
  text-align:center;
}
.slot.is-sep{min-width:.3em}
.slot__char{display:block;transform-origin:50% 50%;backface-visibility:hidden}
.slot__char.out{position:absolute;inset:0;animation:flipOut .16s ease-in forwards}
.slot__char.in{animation:flipIn .24s cubic-bezier(.2,.85,.3,1) both}
@keyframes flipOut{to{transform:rotateX(-88deg);opacity:0}}
@keyframes flipIn{from{transform:rotateX(88deg);opacity:0}to{transform:rotateX(0);opacity:1}}
.slot::after{
  content:"";
  position:absolute;
  left:6%;right:6%;
  top:50%;
  height:1px;
  background:rgba(0,0,0,.6);
  opacity:.5;
  pointer-events:none;
}

.ctl{
  margin-top:26px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.ctl button{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font:500 15px/1.4 var(--font);
  letter-spacing:-.004em;
  color:var(--ink-dim);
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  padding:8px 18px;
  cursor:pointer;
  transition:color .2s ease, border-color .2s ease, background .2s ease;
}
.ctl button:hover{color:var(--ink);border-color:rgba(157,255,50,.35);background:rgba(157,255,50,.07)}
.ctl button:focus-visible{outline:1px solid var(--lime);outline-offset:2px}
.ctl button.is-key{color:var(--lime);border-color:rgba(157,255,50,.32)}

.rail{
  position:absolute;
  right:clamp(18px,3vw,40px);
  top:50%;
  transform:translateY(-50%);
  width:2px;height:180px;
  background:rgba(255,255,255,.08);
  border-radius:2px;
  z-index:4;
}
.rail__fill{
  position:absolute;
  top:0;left:0;right:0;height:0;
  background:var(--lime);
  border-radius:2px;
  box-shadow:0 0 10px rgba(157,255,50,.7);
}

@media (max-width:820px){
  .scrim{opacity:1}
  .topbar{left:14px;right:14px;top:130px;max-width:none}
  .segmented{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .segmented::-webkit-scrollbar{display:none}

<template id="page:evento/2026_10_14_XIV_ConcursoIA">
  <h2 class="stage__title">Concurso de IA</h2>
  <p class="stage__body">
    El XIV JISIC reúne conferencias magistrales, workshops técnicos con cupos limitados, un concurso de Inteligencia Artificial y un espacio de networking entre estudiantes, académicos y empresas. La entrada a las charlas y al concurso es gratuita.</p>
  <div class="meta">
    <div><span>Concurso de IA</span><b>Competencia abierta a estudiantes y participantes</b></div>
    <br>El Concurso Ingenio Artificial JISIC 2026 invita a equipos de estudiantes universitarios a resolver un desafío práctico de visión por computador con redes neuronales profundas. Los participantes deberán implementar, entrenar y validar un modelo de IA desde cero usando Python, TensorFlow 2.x y Google Colab, sin utilizar modelos preentrenados.
    <br>El desafío consiste en clasificar imágenes de un conjunto de datos proporcionado por los organizadores, aplicando técnicas de preprocesamiento, diseño de arquitectura y ajuste de hiperparámetros.</b>
    <br>Los equipos tendrán acceso a un conjunto de datos de entrenamiento y validación, y deberán presentar su modelo final junto con un informe técnico que explique su enfoque, decisiones de diseño y resultados obtenidos.
    <br>
El concurso se realizará el 26 de octubre de 2026 en las salas de cómputo designadas por JISIC 2026.
<br>Está dirigido a equipos de 3 estudiantes universitarios de cualquier institución, carrera o laboratorio de investigación.

La evaluación considerará el rendimiento del modelo, la originalidad de la arquitectura, la justificación técnica y la calidad del código. Los equipos ganadores recibirán reconocimientos, medallas, certificados y premios académicos vinculados al campo de la Inteligencia Artificial.

Para participar, todos los integrantes deberán estar inscritos en JISIC 2026 y completar el formulario oficial del concurso.

<script>
(function(){
  "use strict";

  const CFG = { step: 20, radius: 460, dragFactor: 1.1, ease: 0.12 };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mod = (a, n) => ((a % n) + n) % n;
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const initials = s => s.replace(/^(PhD\.|MSc\.)\s*/, "").split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

  function init(root){
    if (root.__carousel) return;
    root.__carousel = true;

    let items;
    try { items = JSON.parse(root.querySelector(".carousel-data").textContent); } catch (e) { return; }
    const N = items.length;
    if (!N) return;

    root.insertAdjacentHTML("beforeend",
      '<div class="tc-stage" tabindex="0" role="group" aria-roledescription="carrusel" aria-label="Comité organizador">' +
        '<div class="tc-track"></div></div>' +
      '<div class="tc-foot">' +
        '<div class="tc-nav"><button type="button" class="tc-prev" aria-label="Anterior">‹</button>' +
        '<button type="button" class="tc-next" aria-label="Siguiente">›</button></div>' +
        '<div class="tc-info"><h3 class="tc-name">—</h3><p class="tc-role"></p><div class="tc-dots"></div></div>' +
      '</div>');

    const stage = root.querySelector(".tc-stage"), track = root.querySelector(".tc-track");
    const dotsEl = root.querySelector(".tc-dots"), nameEl = root.querySelector(".tc-name"), roleEl = root.querySelector(".tc-role");

    let pos = 0, target = 0, active = -1;
    let dragging = false, moved = false, startX = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0;

    const nearestIndex = i => { let d = mod(i - target, N); if (d > N / 2) d -= N; return target + d; };
    const goTo = t => { target = Math.round(t); };

    const cards = items.map((it, i) => {
      const base = (root.closest("[data-base]") || {dataset:{}}).dataset.base || document.baseURI;
      const src = it.img ? new URL(String(it.img).replace(/^\/+/, ""), base).href : "";
      const hue = it.hue != null ? it.hue : 95 + i * 38;
      const c = document.createElement("div");
      c.className = "tc-card";
      c.setAttribute("role", "group");
      c.setAttribute("aria-label", (i + 1) + " de " + N + ": " + it.name);
      c.innerHTML = (src
        ? '<img src="' + esc(src) + '" alt="' + esc(it.name) + '">'
        : '<div class="tc-art" style="background:radial-gradient(70% 45% at 50% 36%,hsla(' + hue + ',85%,60%,.55),transparent 72%),' +
          'linear-gradient(160deg,hsl(' + hue + ',40%,20%),hsl(' + (hue + 20) + ',35%,8%))"><b>' + esc(initials(it.name)) + '</b></div>') +
        '<span class="tc-num">' + pad(i + 1) + '</span>';
      c.addEventListener("click", () => { if (!moved) goTo(nearestIndex(i)); });
      track.appendChild(c);
      const d = document.createElement("button");
      d.type = "button";
      d.setAttribute("aria-label", "Ir a " + it.name);
      d.addEventListener("click", () => goTo(nearestIndex(i)));
      dotsEl.appendChild(d);
      return c;
    });

    function sync(i){
      const it = items[i];
      nameEl.style.opacity = 0;
      setTimeout(() => { nameEl.textContent = it.name; roleEl.textContent = it.role || ""; nameEl.style.opacity = 1; }, 110);
      [].forEach.call(dotsEl.children, (d, k) => d.classList.toggle("active", k === i));
    }

    function render(){
      cards.forEach((c, i) => {
        let off = mod(i - pos, N); if (off > N / 2) off -= N;
        const a = off * CFG.step * Math.PI / 180;
        const x = Math.sin(a) * CFG.radius;
        const z = (1 - Math.cos(a)) * CFG.radius * 0.55;
        const abs = Math.abs(off);
        c.style.transform = "translate3d(" + x + "px,0," + z + "px) rotateY(" + (-off * CFG.step) + "deg)";
        c.style.opacity = abs > N / 2 - 0.6 ? Math.max(0, (N / 2 - abs) / 0.6) : 1;
        c.style.zIndex = Math.round(100 - abs * 10);
        c.style.filter = "brightness(" + (1 - Math.min(abs, 3) * 0.12) + ")";
      });
      const idx = mod(Math.round(pos), N);
      if (idx !== active){ active = idx; sync(idx); }
    }

    function loop(){
      if (!root.isConnected) return;
      if (!dragging){
        const d = target - pos;
        pos = Math.abs(d) < 0.0005 ? target : pos + d * (reduce ? 1 : CFG.ease);
      }
      render();
      requestAnimationFrame(loop);
    }

    const pxPerCard = () => Math.sin(CFG.step * Math.PI / 180) * CFG.radius;
    stage.addEventListener("pointerdown", e => {
      dragging = true; moved = false; startX = lastX = e.clientX; startPos = pos; lastT = performance.now(); vel = 0;
      stage.classList.add("dragging");
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove", e => {
      if (!dragging) return;
      const now = performance.now(), dx = e.clientX - startX;
      if (Math.abs(dx) > 5) moved = true;
      pos = startPos - dx / pxPerCard() * CFG.dragFactor;
      vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    });
    const end = () => {
      if (!dragging) return;
      dragging = false; stage.classList.remove("dragging");
      target = Math.round(pos - vel * 4);
      setTimeout(() => { moved = false; }, 0);
    };
    stage.addEventListener("pointerup", end);
    stage.addEventListener("pointercancel", end);

    let wheelLock = 0;
    stage.addEventListener("wheel", e => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
      if (!d) return;
      e.preventDefault();
      const now = Date.now(); if (now - wheelLock < 350) return;
      wheelLock = now; goTo(target + Math.sign(d));
    }, { passive: false });

    stage.addEventListener("keydown", e => {
      if (e.key === "ArrowRight"){ goTo(target + 1); e.preventDefault(); }
      if (e.key === "ArrowLeft"){ goTo(target - 1); e.preventDefault(); }
    });
    root.querySelector(".tc-next").addEventListener("click", () => goTo(target + 1));
    root.querySelector(".tc-prev").addEventListener("click", () => goTo(target - 1));

    goTo(0); pos = target;
    loop();
  }

  window.initCarousels = function(scope){
    (scope || document).querySelectorAll("[data-carousel]").forEach(init);
  };
  window.initCarousels(document);
})();

</script>
<script>
(function(){
  "use strict";
  var p2 = function(n){ return String(n).padStart(2, "0"); };

  function setupPodcast(el){
    if (el.__pcReady) return;
    el.__pcReady = true;

    var start = Date.parse(el.dataset.start || "");
    var dur = (parseInt(el.dataset.duration, 10) || 120) * 60000;
    var link = (el.dataset.link || "").trim();
    var timer = el.querySelector(".pc__timer");
    var label = el.querySelector(".pc__timer-label");
    var cta = el.querySelector(".pc__cta");
    var ctaTxt = cta && cta.querySelector("span");
    var u = {};
    ["d","h","m","s"].forEach(function(k){ u[k] = el.querySelector('[data-u="' + k + '"]'); });

    if (cta){
      if (link){ cta.href = link; cta.target = "_blank"; cta.rel = "noopener"; }
      else { cta.removeAttribute("href"); cta.setAttribute("aria-disabled", "true"); }
    }

    function render(){
      if (!document.contains(el)){ clearInterval(el.__pcTimer); return; }
      if (isNaN(start)){ if (timer) timer.hidden = true; return; }
      var left = start - Date.now(), state;
      if (left > 0) state = "soon";
      else if (-left < dur) state = "live";
      else state = "done";
      el.dataset.state = state;

      if (state === "soon"){
        var t = Math.floor(left / 1000);
        var d = Math.floor(t / 86400); t -= d * 86400;
        var h = Math.floor(t / 3600);  t -= h * 3600;
        var m = Math.floor(t / 60);    var s = t - m * 60;
        u.d.textContent = p2(d); u.h.textContent = p2(h); u.m.textContent = p2(m); u.s.textContent = p2(s);
        if (label) label.textContent = "Inicia en";
      } else if (label){
        label.textContent = state === "live" ? "¡En vivo ahora!" : "Evento finalizado";
      }
      if (timer) timer.classList.toggle("is-over", state !== "soon");
      if (ctaTxt && link) ctaTxt.textContent = state === "live" ? "Unirse ahora" : state === "done" ? "Ver el podcast" : "Ir al podcast";
      else if (ctaTxt) ctaTxt.textContent = "Enlace próximamente";
    }
    render();
    el.__pcTimer = setInterval(render, 1000);
  }

  window.initPodcasts = function(root){
    (root || document).querySelectorAll(".pc").forEach(setupPodcast);
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ window.initPodcasts(); });
  else window.initPodcasts();
})();

</script>

/* ======================================================================

  function parts(ms){
    const d = new Date(ms);

  }
  const hhmm    = ms => { const p = parts(ms); return p2(p.h) + ":" + p2(p.mi); };
  const flapStr = ms => { const p = parts(ms); return p2(p.d) + " " + MN[p.m] + (SLOTS ? " " + hhmm(ms) : ""); };

  /* ---------- agenda (.hor__p) → charlas ---------- */
  const SKIP = /^(registro|break|almuerzo|palabras|ceremonia|inauguraci|ingreso|reservado|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)/i;
  function catsOf(title, inWorkshopTab){
    if (inWorkshopTab || /workshop|taller/i.test(title)) return ["workshop"];

  function talksFrom(tplId){
    const tpl = document.getElementById("page:" + tplId);
    if (!tpl) return [];
    const root = tpl.content;

    root.querySelectorAll(".hor__tabs label[for]").forEach(l => {

    const out = [];
    root.querySelectorAll(".hor__p").forEach(panel => {
      const head = ((panel.querySelector(".hor__date") || {}).textContent || "").replace(/\s+/g, " ").trim();
      const dm = head.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
      if (!dm) return;
      const mon = MLONG.indexOf(norm(dm[2]));
      if (mon < 0) return;
      const bits  = head.split("·").map(s => s.trim());
      const venue = (bits.length > 1 ? bits[bits.length - 1] : "").replace(/\s+–\s+/g, " · ");
      const topic = bits.length > 2 ? bits.slice(1, -1).join(" · ") : "";
      const tab   = tabs[panel.id] || "";
      const isWs  = /^p-w/.test(panel.id);
      panel.querySelectorAll("li").forEach(li => {
        const tm    = ((li.querySelector("time") || {}).textContent || "").trim();
        const hm    = tm.match(/(\d{1,2}):(\d{2})/);
        const title = ((li.querySelector("b") || {}).textContent || "").replace(/\s+/g, " ").trim();
        if (!hm || !title || SKIP.test(title)) return;
        const who  = ((li.querySelector("span") || {}).textContent || "").replace(/\s+/g, " ").trim();
        const k    = who.indexOf(" · ");
        const name = k >= 0 ? who.slice(0, k) : who;
        const role = k >= 0 ? who.slice(k + 3) : "";
        out.push({
          ms:    Date.UTC(+dm[3], mon, +dm[1], +hm[1], +hm[2]),
          date:  dm[3] + "-" + p2(mon + 1) + "-" + p2(+dm[1]),
          time:  tm.replace(/\s*-\s*/, "–"),
          cats:  catsOf(title, isWs),
          type:  [tab, topic].filter(Boolean).join(" · "),
          title: title,
          venue: venue || VENUE,
          speaker: name || "Comité organizador JISIC",
          body:  role ? name + " · " + role : [ED.label, topic].filter(Boolean).join(" · ")
        });
      });

  const RAW = SLOTS ? talksFrom(ED.tpl) : ED.events.map(e => {
    const [y,m,d] = e.date.split("-").map(Number);
    return Object.assign({}, e, { ms: Date.UTC(y, m-1, d) });
  });
  const EV = RAW.map((e, i) => Object.assign({}, e, { kind:"event", ord:i,
                 cats: e.cats && e.cats.length ? e.cats : ["conferencia"] }))
                .sort((a,b) => a.ms - b.ms || a.ord - b.ord);

  /* ================== escala ==================
     f ∈ [0,1] es la posición en el eje. El tramo [0, PRE_F) es el preludio
     con Inicio y las páginas de menú; el resto depende del modo:
     - "time":  lineal por días entre ED.start y ED.end (temporada actual)
     - "slots": una posición por charla; los días se separan con un hueco */
  const PRE_F = SLOTS ? 0.14 : 0.2;
  const now = new Date();
  const todayMs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const LABELS = [];
  let START = 0, END = 0, STEP_F = 0.01, NEAR_F = 0.02, fracOf, msOf;

  if (!SLOTS){
    const toMs = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y, m-1, d); };
    START = toMs(ED.start); END = toMs(ED.end);
    const SPAN = Math.max(END - START, DAY);
    fracOf = ms => clamp(PRE_F + (ms - START) / SPAN * (1 - PRE_F), 0, 1);
    msOf   = f  => START + Math.round((clamp(f, 0, 1) - PRE_F) / (1 - PRE_F) * SPAN / DAY) * DAY;
    STEP_F = DAY / SPAN * (1 - PRE_F);
    NEAR_F = 12 * STEP_F;
    EV.forEach(e => { e.f = fracOf(e.ms); });
    const s0 = new Date(START);
    let y = s0.getUTCFullYear(), m = s0.getUTCMonth(), first = true;
    while (Date.UTC(y, m, 1) <= END){
      LABELS.push({ f: fracOf(Math.max(Date.UTC(y, m, 1), START)), text: (first || m === 0) ? y + " - " + MN[m] : MN[m] });
      first = false;
      if (++m > 11){ m = 0; y++; }
    }
  } else {
    const GAP = 1.6;                              /* hueco entre días, en charlas */
    const us = [];
    let u = 0.5, prev = null;
    EV.forEach(e => { if (prev !== null && e.date !== prev) u += GAP; us.push(u); prev = e.date; u += 1; });
    const UNITS = Math.max(u - 0.5, 1);
    EV.forEach((e, i) => { e.f = PRE_F + us[i] / UNITS * (1 - PRE_F); });
    STEP_F = (1 - PRE_F) / UNITS;
    NEAR_F = 0.75 * STEP_F;
    if (EV.length){ START = EV[0].ms; END = EV[EV.length - 1].ms; }
    /* hora que muestra el contador entre charlas; salta de un día al otro en el hueco */
    const K = [];
    EV.forEach((e, i) => {
      const nx = EV[i + 1];
      K.push([e.f, e.ms]);
      if (nx && nx.date !== e.date){ const mid = (e.f + nx.f) / 2; K.push([mid - 1e-9, e.ms]); K.push([mid, nx.ms]); }
    });
    msOf = f => {
      if (!K.length) return 0;
      if (f < PRE_F) return START - DAY;
      if (f <= K[0][0]) return K[0][1];
      for (let i = 1; i < K.length; i++){
        if (f <= K[i][0]){
          const f0 = K[i-1][0], m0 = K[i-1][1], f1 = K[i][0], m1 = K[i][1];
          const t = f1 > f0 ? (f - f0) / (f1 - f0) : 1;
          return Math.round((m0 + t * (m1 - m0)) / (5 * MIN)) * 5 * MIN;
        }
      }
      return K[K.length - 1][1];
    };
    fracOf = ms => { for (let i = 0; i < EV.length; i++) if (EV[i].ms >= ms) return EV[i].f; return 1; };
    EV.forEach((e, i) => {
      if (i && EV[i-1].date === e.date) return;

  let currentStr = "";
  const slots = [];

  function makeSlot(ch){
    const slot = document.createElement("span");
    slot.className = "slot" + (/[.,\s]/.test(ch) ? " is-sep" : "");

  function setChar(slot, ch){
    if (slot.dataset.ch === ch) return;

    slot.querySelectorAll(".slot__char.out").forEach(n => n.remove());
    const old = slot.querySelector(".slot__char:not(.out)");
    if (reduce){
      if (old) old.textContent = ch;

    if (str === currentStr) return;

    while (slots.length < str.length){
      const s = makeSlot(" ");
      counter.appendChild(s);
      slots.push(s);

    while (slots.length > str.length){
      slots.pop().remove();

  const cdBox = document.getElementById("countdown");

  function updateCountdown(){

    const [y, m, d] = ev.date.split("-").map(Number);

    cdBox.hidden = left <= 0;

    let h = Math.floor(left / 3600000);
    const w = Math.floor(h / 168); h -= w * 168;
    const dd = Math.floor(h / 24); h -= dd * 24;
    const p2 = n => String(n).padStart(2, "0");

      whenEl.textContent = SLOTS ? (e.type || longStr(e.ms)) : whenLabel(e.ms);
      whenEl.classList.toggle("is-soon", todayIn && e.ms >= todayMs && (e.ms - todayMs) / DAY <= 30);
      titleEl.innerHTML = "<span>" + esc(e.title) + "</span>";
      bodyEl.innerHTML  = "<span>" + esc(e.body) + "</span>";
      metaEl.innerHTML =
        '<div><span>Sede</span><b>' + esc(e.venue) + '</b></div>' +
        '<div><span>' + (SLOTS ? "Ponente" : "Responsable") + '</span><b>' + esc(e.speaker) + '</b></div>' +
        '<div><span>Fecha</span><b>' + longStr(e.ms) + (e.time ? " · " + e.time : "") + '</b></div>';
      setNavCurrent("evento");
      brainBurst();
      embedPage(item);
    } else {
      stage.classList.remove("is-idle");
      stage.classList.add("is-page");
      eyebrow.textContent = item.kind === "home" ? "Inicio" : "Página · " + item.title;
      whenEl.textContent = "";
      whenEl.classList.remove("is-soon");
      titleEl.innerHTML = "<span>" + item.title + "</span>";
      bodyEl.innerHTML  = "<span>" + item.body + "</span>";
      metaEl.innerHTML = (item.meta || []).map(function(kv){
        return '<div><span>' + kv[0] + '</span><b>' + kv[1] + '</b></div>';
      }).join("");
      setNavCurrent(item.id);
      embedPage(item);
    }

    const idOf = i => (i >= 0 ? ITEMS[i] : null);
    evEls.forEach((el, i) => el.classList.toggle("is-active", idOf(idx) === EV[i]));
    PAGE_ITEMS.forEach(p => p.el.classList.toggle("is-active", idOf(idx) === p));

    if (!reduce){
      titleEl.classList.remove("swap-in"); bodyEl.classList.remove("swap-in");
      void titleEl.offsetWidth;
      titleEl.classList.add("swap-in"); bodyEl.classList.add("swap-in");

  const STEPS = 40;
  const PAL_LIME = [], PAL_CREST = [], PAL_WARM = [];
  for (let i = 0; i <= STEPS; i++){
    const a = (i / STEPS).toFixed(3);
    PAL_LIME.push("rgba(157,255,50," + a + ")");
    PAL_CREST.push("rgba(226,255,190," + a + ")");
    PAL_WARM.push("rgba(232,255,198," + a + ")");
  }
  const pick = (pal, a) => pal[clamp(Math.round(a * STEPS), 0, STEPS)];

  const CELL = 15;
  let cells = [], dpr = 1;

  function buildGrid(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cols = Math.ceil(w / CELL);
    const rows = Math.ceil(h / CELL);
    cells = [];
    for (let y = 0; y < rows; y++){
      for (let x = 0; x < cols; x++){
        const nx = cols > 1 ? x / (cols - 1) : 0;
        const ny = rows > 1 ? y / (rows - 1) : 0;
        const base = (1 - nx) * 0.78 + ny * 0.32;
        const thr  = base * 0.9 + Math.random() * 0.42 - 0.12;
        if (thr > 1.05) continue;
        const keep = Math.min(1, Math.max(0, (nx - 0.20) / 0.42));
        if (Math.random() > keep * keep * 0.85) continue;
        cells.push({
          x: x * CELL, y: y * CELL, t: thr,
          s: 3 + Math.random() * (CELL - 7),
          ph: Math.random() * Math.PI * 2,
          sp: 0.6 + Math.random() * 1.6
        });
      }
    }
  }

  function drawBloom(p, time){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const reach = 0.28 + p * 0.9;
    for (let i = 0; i < cells.length; i++){
      const c = cells[i];
      const d = reach - c.t;
      if (d <= 0) continue;
      let a = Math.min(d / 0.12, 1);
      const edge = d < 0.1;
      if (!reduce) a *= 0.55 + 0.45 * Math.sin(time * 0.0012 * c.sp + c.ph);
      a = Math.max(0, Math.min(a, 1)) * 0.62;
      if (a < 0.02) continue;
      ctx.fillStyle = edge ? pick(PAL_CREST, a) : pick(PAL_LIME, a * 0.72);
      ctx.fillRect(c.x, c.y, c.s, c.s);
    }
  }

  const BRAIN_D = "M104,14 C132,8 160,18 174,40 C188,62 190,76 184,88 " +
                  "C179,98 170,101 163,103 C171,112 167,124 153,128 " +
                  "C143,131 135,128 129,133 C119,141 104,143 93,137 " +
                  "C86,133 79,136 72,139 C74,148 71,155 63,160 " +
                  "C55,158 56,149 55,141 C46,138 38,131 34,119 " +
                  "C30,110 30,102 26,94 C17,78 14,56 26,40 " +
                  "C38,24 56,14 74,12 C84,11 95,12 104,14 Z";

  const FOLD_D = [
    "M58,36 C80,32 94,46 86,60 C80,72 94,80 110,74 C124,69 132,78 130,90",
    "M150,32 C142,48 154,56 148,68 C142,80 124,78 120,90 C117,99 122,108 132,110",
    "M34,64 C52,62 60,72 56,84 C52,96 64,102 80,100 C94,98 100,106 98,118",
    "M96,22 C108,34 104,48 116,52 C130,57 136,44 150,48 C162,51 166,62 162,72",
    "M70,110 C86,108 96,118 112,114 C126,111 134,118 138,126",
    "M44,98 C56,110 48,120 62,126 C72,130 78,128 86,132"
  ];

  let nNodes = [], nEdges = [], nAdj = [], nPulses = [];
  let foldGeom = [], silhouette = [];
  let brainBox = {cx:0, cy:0, s:1};
  let neuroT0 = 0, wasVisible = false;

  const svgHost = document.createElementNS(SVGNS, "svg");
  svgHost.setAttribute("width", "0");
  svgHost.setAttribute("height", "0");
  svgHost.style.cssText = "position:absolute;left:-9999px;top:0;width:0;height:0;overflow:hidden";
  document.body.appendChild(svgHost);

  function samplePath(d, step){
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d);
    svgHost.appendChild(p);
    const L = p.getTotalLength();
    const out = [];
    for (let l = 0; l <= L; l += step){
      const pt = p.getPointAtLength(l);
      out.push({x: pt.x, y: pt.y});
    }
    svgHost.removeChild(p);
    return out;
  }

  const hitCv  = document.createElement("canvas");
  hitCv.width = 200; hitCv.height = 170;
  const hitCtx = hitCv.getContext("2d");
  const brainPath = new Path2D(BRAIN_D);
  const insideBrain = (x, y) => hitCtx.isPointInPath(brainPath, x, y);

  function brainBurst(){
    if (reduce || !nNodes.length) return;
    for (let i = 0; i < 22; i++){
      const n = nNodes[(Math.random() * nNodes.length) | 0];
      if (n) n.flash = 1;
    }
  }

  function buildBrain(){
    const outline = samplePath(BRAIN_D, 6.0);
    const pts = outline.map(p => ({x:p.x, y:p.y, edge:true}));

    const MIN_IN = 7.6, MIN_EDGE = 6.2;
    let tries = 0;
    while (tries < 9000 && pts.length < 320){
      tries++;
      const x = 10 + Math.random() * 184;
      const y = 6  + Math.random() * 160;
      if (!insideBrain(x, y)) continue;
      let ok = true;
      for (let i = 0; i < pts.length; i++){
        const dx = pts[i].x - x, dy = pts[i].y - y;
        const m = pts[i].edge ? MIN_EDGE : MIN_IN;
        if (dx*dx + dy*dy < m*m){ ok = false; break; }
      }
      if (ok) pts.push({x, y, edge:false});
    }

    nNodes = pts.map((p) => {
      const ang = Math.random() * Math.PI * 2;
      const rad = 70 + Math.random() * 190;
      const dCenter = Math.hypot(p.x - 100, p.y - 86) / 110;
      return {
        x:p.x, y:p.y,
        sx:p.x + Math.cos(ang) * rad,
        sy:p.y + Math.sin(ang) * rad * 0.72,
        cx:0, cy:0, form:0,
        edge:p.edge,
        ph: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.3,
        delay: dCenter * 0.9 + Math.random() * 0.55,
        flash: 0
      };
    });

    const R = 17.5;
    nEdges = [];
    nAdj = nNodes.map(() => []);
    const seen = new Set();
    for (let i = 0; i < nNodes.length; i++){
      const near = [];
      for (let j = 0; j < nNodes.length; j++){
        if (i === j) continue;
        const dx = nNodes[j].x - nNodes[i].x, dy = nNodes[j].y - nNodes[i].y;
        const d2 = dx*dx + dy*dy;
        if (d2 < R*R) near.push({j, d: Math.sqrt(d2)});
      }
      near.sort((a,b) => a.d - b.d);
      for (let k = 0; k < Math.min(near.length, 3); k++){
        const j = near[k].j;
        const key = i < j ? i + "_" + j : j + "_" + i;
        if (seen.has(key)) continue;
        seen.add(key);
        nEdges.push({a:i, b:j, len:near[k].d, delay: Math.random() * 1.5});
        nAdj[i].push(nEdges.length - 1);
        nAdj[j].push(nEdges.length - 1);
      }
    }

    const count = Math.max(10, Math.min(34, Math.round(nEdges.length / 17)));
    nPulses = [];
    for (let i = 0; i < count; i++){
      nPulses.push({
        e: (Math.random() * nEdges.length) | 0,
        dir: Math.random() < .5 ? 1 : 0,
        t: Math.random(),
        sp: 0.55 + Math.random() * 0.75
      });
    }

    foldGeom = FOLD_D.map(d => samplePath(d, 2.6));
    silhouette = samplePath(BRAIN_D, 1.4);
  }

  function placeBrain(){
    const w = neuro.clientWidth, h = neuro.clientHeight;
    neuro.width  = Math.floor(w * dpr);
    neuro.height = Math.floor(h * dpr);
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const small = w < 820;
    const s = small
      ? Math.min((w * 0.68) / 200, (h * 0.34) / 170)
      : Math.min((w * 0.44) / 200, (h * 0.82) / 170);
    brainBox = {
      cx: small ? w * 0.65 : w * 0.72,
      cy: small ? h * 0.27 : h * 0.50,
      s
    };
  }

  const eOutCubic = t => 1 - Math.pow(1 - t, 3);
  const eOutBack  = t => { const c = 1.24; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  function drawNeuro(time){
    const w = neuro.clientWidth, h = neuro.clientHeight;
    nctx.clearRect(0, 0, w, h);
    if (!nNodes.length) return;

    if (!neuroT0) neuroT0 = time;
    const T = reduce ? 99 : (time - neuroT0) / 1000;
    const t = time / 1000;

    const fade = clamp(T / 1.1, 0, 1);
    const { cx, cy } = brainBox;
    const breathe = reduce ? 1 : (1 + 0.013 * Math.sin(t * 0.62));
    const s = brainBox.s * breathe;
    const rot = reduce ? 0 : Math.sin(t * 0.21) * 0.022;
    const rad = 200 * s * 0.66;

    nctx.save();
    nctx.translate(cx, cy);
    nctx.scale(1, 0.92);
    const g = nctx.createRadialGradient(0, 0, 0, 0, 0, rad);
    g.addColorStop(0,   "rgba(7,8,7,.92)");
    g.addColorStop(.46, "rgba(7,8,7,.80)");
    g.addColorStop(.78, "rgba(7,8,7,.34)");
    g.addColorStop(1,   "rgba(7,8,7,0)");
    nctx.globalAlpha = fade;
    nctx.fillStyle = g;
    nctx.beginPath();
    nctx.arc(0, 0, rad, 0, Math.PI * 2);
    nctx.fill();

    const aura = clamp((T - 2.4) / 2.2, 0, 1) * (0.55 + 0.45 * Math.sin(t * 0.8));
    if (aura > 0.01){
      const ga = nctx.createRadialGradient(0, 0, rad * 0.1, 0, 0, rad * 0.92);
      ga.addColorStop(0, "rgba(157,255,50," + (0.13 * aura) + ")");
      ga.addColorStop(1, "rgba(157,255,50,0)");
      nctx.fillStyle = ga;
      nctx.beginPath();
      nctx.arc(0, 0, rad * 0.92, 0, Math.PI * 2);
      nctx.fill();
    }
    nctx.restore();
    nctx.globalAlpha = 1;

    nctx.save();
    nctx.translate(cx, cy);
    nctx.rotate(rot);
    nctx.scale(s, s);
    nctx.translate(-100, -86);
    const U = 1 / s;

    const scanCycle = 7.5, scanStart = 4.6;
    const scanT = T > scanStart ? ((T - scanStart) % scanCycle) / 1.7 : -1;
    const scanX = scanT >= 0 && scanT <= 1 ? 10 + scanT * 186 : -999;

    for (let i = 0; i < nNodes.length; i++){
      const n = nNodes[i];
      const p = clamp((T - n.delay) / 2.0, 0, 1);
      const k = reduce ? 1 : eOutBack(p);
      const jx = reduce ? 0 : Math.sin(t * n.sp + n.ph) * 0.45;
      const jy = reduce ? 0 : Math.cos(t * n.sp * 0.8 + n.ph) * 0.45;
      n.cx = n.sx + (n.x - n.sx) * k + jx * p;
      n.cy = n.sy + (n.y - n.sy) * k + jy * p;
      n.form = p;
      if (scanX > -900){
        const d = Math.abs(n.cx - scanX);
        if (d < 5) n.flash = Math.max(n.flash, 0.85 * (1 - d / 5));
      }
      n.flash *= reduce ? 0 : 0.955;
    }

    const foldA = clamp((T - 3.0) / 1.8, 0, 1) * 0.5 * fade;
    if (foldA > 0.01){
      nctx.strokeStyle = "rgba(157,255,50," + foldA + ")";
      nctx.lineWidth = 0.9 * U;
      nctx.lineCap = "round";
      nctx.setLineDash([2.4 * U, 4.6 * U]);
      nctx.lineDashOffset = reduce ? 0 : -t * 7 * U;
      for (let f = 0; f < foldGeom.length; f++){
        const pts = foldGeom[f];
        nctx.beginPath();
        nctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) nctx.lineTo(pts[i].x, pts[i].y);
        nctx.stroke();
      }
      nctx.setLineDash([]);
    }

    if (silhouette.length){
      const tr = reduce ? 1 : clamp((T - 0.25) / 2.3, 0, 1);
      const n  = Math.max(2, Math.round(eOutCubic(tr) * silhouette.length));
      const hold = clamp((T - 2.9) / 1.4, 0, 1);
      const a = fade * (tr < 1 ? 0.75 : 0.30 + 0.12 * Math.sin(t * 0.9)) * (tr < 1 ? 1 : 0.55 + 0.45 * hold);
      nctx.strokeStyle = "rgba(196,255,128," + a.toFixed(3) + ")";
      nctx.lineWidth = 1.05 * U;
      nctx.lineJoin = "round";
      nctx.beginPath();
      nctx.moveTo(silhouette[0].x, silhouette[0].y);
      for (let i = 1; i < n; i++) nctx.lineTo(silhouette[i].x, silhouette[i].y);
      nctx.stroke();
      if (tr < 1){
        const hd = silhouette[n - 1];
        nctx.fillStyle = "rgba(240,255,215," + fade.toFixed(3) + ")";
        nctx.fillRect(hd.x - 1.6 * U, hd.y - 1.6 * U, 3.2 * U, 3.2 * U);
      }
    }

    nctx.lineWidth = 0.85 * U;
    for (let i = 0; i < nEdges.length; i++){
      const e = nEdges[i];
      const A = nNodes[e.a], B = nNodes[e.b];
      const ea = clamp((T - 1.7 - e.delay) / 1.3, 0, 1) * Math.min(A.form, B.form);
      if (ea < 0.02) continue;
      const near = 1 - Math.min(e.len / 17.5, 1);
      const live = Math.max(A.flash, B.flash);
      const a = fade * ea * (0.17 + near * 0.26 + live * 0.55);
      nctx.strokeStyle = pick(PAL_LIME, a);
      nctx.beginPath();
      nctx.moveTo(A.cx, A.cy);
      nctx.lineTo(B.cx, B.cy);
      nctx.stroke();
    }

    if (!reduce && T > 3.6){
      const dt = 0.016;
      for (let i = 0; i < nPulses.length; i++){
        const p = nPulses[i];
        const e = nEdges[p.e];
        if (!e) continue;
        p.t += p.sp * dt * (14 / Math.max(e.len, 4));
        if (p.t >= 1){
          const end = p.dir ? e.b : e.a;
          nNodes[end].flash = 1;
          const opts = nAdj[end];
          if (opts && opts.length){
            let ne = opts[(Math.random() * opts.length) | 0];
            if (opts.length > 1){
              let guard = 0;
              while (ne === p.e && guard++ < 4) ne = opts[(Math.random() * opts.length) | 0];
            }
            p.e = ne;
            p.dir = nEdges[ne].a === end ? 1 : 0;
          }
          p.t = 0;
          continue;
        }
        const A = nNodes[p.dir ? e.a : e.b];
        const B = nNodes[p.dir ? e.b : e.a];
        const px = A.cx + (B.cx - A.cx) * p.t;
        const py = A.cy + (B.cy - A.cy) * p.t;
        const tail = 0.34;
        const qx = A.cx + (B.cx - A.cx) * Math.max(p.t - tail, 0);
        const qy = A.cy + (B.cy - A.cy) * Math.max(p.t - tail, 0);
        nctx.strokeStyle = "rgba(226,255,190," + (0.55 * fade) + ")";
        nctx.lineWidth = 1.1 * U;
        nctx.beginPath();
        nctx.moveTo(qx, qy);
        nctx.lineTo(px, py);
        nctx.stroke();
        nctx.fillStyle = "rgba(240,255,220," + (0.95 * fade) + ")";
        nctx.fillRect(px - 1.0 * U, py - 1.0 * U, 2.0 * U, 2.0 * U);
      }
    }

    for (let i = 0; i < nNodes.length; i++){
      const n = nNodes[i];
      if (n.form < 0.02) continue;
      const pulse = reduce ? 0.8 : (0.66 + 0.34 * Math.sin(t * 1.5 * n.sp + n.ph));
      const base = (n.edge ? 0.88 : 0.58) * pulse;
      const a = clamp(fade * n.form * (base + n.flash * 0.7), 0, 1);
      if (a < 0.03) continue;
      const sz = (n.edge ? 1.9 : 1.6) + n.flash * 1.8;
      const hot = n.flash > 0.25;
      if (hot){
        nctx.shadowBlur = 9 * n.flash;
        nctx.shadowColor = "rgba(157,255,50,.85)";
      }
      nctx.fillStyle = hot ? pick(PAL_WARM, a) : pick(PAL_LIME, a);
      nctx.fillRect(n.cx - sz / 2, n.cy - sz / 2, sz, sz);
      if (hot){ nctx.shadowBlur = 0; nctx.shadowColor = "transparent"; }
    }

    nctx.restore();
  }

  function scrollTotal(){ return Math.max(1, section.offsetHeight - window.innerHeight); }
  function sectionTop(){ return section.offsetTop; }

  function goTo(f, smooth){
    const top = sectionTop() + clamp(f, 0, 1) * HOLD * scrollTotal();
    window.scrollTo({ top: Math.round(top), behavior: smooth && !reduce ? "smooth" : "auto" });
  }

  function currentF(){
    const r = section.getBoundingClientRect();
    const p = clamp(-r.top / scrollTotal(), 0, 1);
    return clamp(p / HOLD, 0, 1);
  }

  function fFromClientY(cy){
    const r = rail.getBoundingClientRect();
    const raw = (cy - r.top) / Math.max(r.height, 1);
    return clamp((raw - P0) / (P1 - P0), 0, 1);
  }

  let dragging = false, dragId = null;

  spine.addEventListener("pointerdown", (e) => {
    dragging = true;
    dragId = e.pointerId;
    spine.classList.add("is-drag");
    spine.setPointerCapture(e.pointerId);
    spine.focus({preventScroll:true});
    goTo(fFromClientY(e.clientY), false);
    e.preventDefault();
  });

  spine.addEventListener("pointermove", (e) => {
    if (!dragging || e.pointerId !== dragId) return;
    goTo(fFromClientY(e.clientY), false);
    e.preventDefault();
  });

  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    dragId = null;
    spine.classList.remove("is-drag");
    const n = nearestItem(currentF());
    if (n.i >= 0 && n.d <= radiusOf(ITEMS[n.i])) goTo(ITEMS[n.i].f, true);
    if (e) e.preventDefault();
  }
  spine.addEventListener("pointerup", endDrag);
  spine.addEventListener("pointercancel", endDrag);
  window.addEventListener("blur", () => endDrag(null));

  spine.addEventListener("keydown", (e) => {
    const f = currentF();
    const stepDay = d => goTo(clamp(f + d * STEP_F, 0, 1), true);
    const BIG = SLOTS ? 5 : 30;
    let handled = true;
    switch (e.key){
      case "ArrowUp":    stepDay(-1); break;
      case "ArrowDown":  stepDay(1);  break;
      case "PageUp":     stepDay(-BIG); break;
      case "PageDown":   stepDay(BIG);  break;
      case "Home":       goTo(0, true); break;
      case "End":        goTo(1, true); break;
      case "ArrowLeft":  jump(-1); break;
      case "ArrowRight": jump(1);  break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  const modeBtns = Array.prototype.slice.call(document.querySelectorAll('.segmented__item[id^="mode-"]'));
  const qInput   = document.getElementById("agenda-query");
  const hintEl   = document.getElementById("agenda-hint");
  const MODE_LABEL = { all: SLOTS ? "toda la edición" : "toda la temporada", next:"próximos", past:"realizados" };

  let mode = "all", query = "", matchIdx = [];

  function inMode(e){
    if (!todayIn || mode === "all") return true;
    return mode === "next" ? e.ms >= todayMs : e.ms < todayMs;
  }
  function inQuery(e){
    if (!query) return true;
    return norm(e.title + " " + e.type + " " + e.cats.map(k => CATS[k].label).join(" ") + " " + e.venue + " " + e.speaker + " " + e.body).indexOf(query) >= 0;
  }

  function refreshFilter(){
    matchIdx = [];
    for (let i = 0; i < EV.length; i++){
      const ok = inMode(EV[i]) && inQuery(EV[i]);
      if (ok) matchIdx.push(i);
      evEls[i].classList.toggle("is-muted", !ok);
    }
    const n = matchIdx.length;
    if (query){
      hintEl.classList.toggle("is-empty", n === 0);
      hintEl.innerHTML = n === 0
        ? "Sin coincidencias en <b>" + MODE_LABEL[mode] + "</b>"
        : "<b>" + n + "</b> " + (n === 1 ? "coincidencia" : "coincidencias") + " · Enter para ir a la primera";
    } else {
      hintEl.classList.remove("is-empty");
      hintEl.innerHTML = "<b>" + n + "</b> " + (n === 1 ? "evento" : "eventos") +
                          " · " + MODE_LABEL[mode] + " · arrastra el nodo";
    }
    document.getElementById("agenda-submit").disabled = n === 0;
  }

  function goFirstMatch(){
    if (!matchIdx.length) return;
    let pick = matchIdx[0];
    if (todayIn){
      for (let k = 0; k < matchIdx.length; k++){
        if (EV[matchIdx[k]].ms >= todayMs){ pick = matchIdx[k]; break; }
      }
    }
    goTo(EV[pick].f, true);
  }

  modeBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      modeBtns.forEach(b => b.setAttribute("aria-selected", String(b === btn)));
      mode = btn.id.replace("mode-", "");
      refreshFilter();
      goFirstMatch();
    });
  });

  qInput.addEventListener("input", () => {
    query = norm(qInput.value.trim());
    refreshFilter();
  });

  document.getElementById("agenda-form").addEventListener("submit", (e) => {
    e.preventDefault();
    goFirstMatch();
    qInput.blur();
  });

  function jump(dir){
    const f = currentF(), eps = STEP_F * 0.25;
    const list = matchIdx.length ? matchIdx : EV.map((_, i) => i);
    if (dir > 0){
      for (let k = 0; k < list.length; k++) if (EV[list[k]].f > f + eps) return goTo(EV[list[k]].f, true);
      return goTo(1, true);
    }
    for (let k = list.length - 1; k >= 0; k--) if (EV[list[k]].f < f - eps) return goTo(EV[list[k]].f, true);
    return goTo(0, true);
  }

  document.getElementById("btnPrev").addEventListener("click", () => jump(-1));
  document.getElementById("btnNext").addEventListener("click", () => jump(1));
  document.getElementById("btnToday").addEventListener("click", () => {
    goTo(todayIn ? todayF : 0, true);
  });

  let rafId = null;

  function frame(time){
    const f = currentF();
    const pos = posOf(f);
    const cursorMs = msOf(f);

    node.style.top = (pos * 100) + "%";
    halo.style.top = (pos * 100) + "%";
    fill.style.height = (pos * 100) + "%";
    railFill.style.height = (f * 100) + "%";

    lblEls.forEach(L => {
      const d = Math.abs(L.f - f);
      const past = L.f <= f + 0.002;
      L.el.classList.toggle("is-active", d < 0.035);
      L.el.classList.toggle("is-past", past && d >= 0.035);
      L.el.style.opacity = String(clamp(1 - d * 2.2, 0.2, 1));
      L.tick.classList.toggle("is-lit", past);
    });

    const near = nearestItem(f);
    setItem(near.i >= 0 && near.d <= radiusOf(ITEMS[near.i]) ? near.i : -1, f);

    const inYear = f >= PRE_F - 1e-9 && EV.length > 0;
    spine.setAttribute("aria-valuenow", String(Math.round(f * 1000)));
    spine.setAttribute("aria-valuetext", inYear
      ? longStr(cursorMs) + (SLOTS ? ", " + hhmm(cursorMs) : "")
      : "Antes del inicio de la " + (SLOTS ? "edición" : "temporada"));

    if (inYear) renderFlap(flapStr(cursorMs), time);
    drawBloom(f, time);
    drawNeuro(time);
    rafId = requestAnimationFrame(frame);
  }

  function resize(){
    buildGrid();
    placeBrain();
  }

  window.addEventListener("resize", () => {
    clearTimeout(window.__rt);
    window.__rt = setTimeout(resize, 150);
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && rafId === null){
        if (wasVisible) neuroT0 = 0;
        wasVisible = true;
        rafId = requestAnimationFrame(frame);
      } else if (!e.isIntersecting && rafId !== null){
        cancelAnimationFrame(rafId); rafId = null;
      }
    });
  }, {rootMargin:"120px"});

  function nextUpcomingEvent(){
    if (!EV.length) return null;
    if (SLOTS) return EV[0];
    for (let i = 0; i < EV.length; i++) if (EV[i].ms >= todayMs) return EV[i];
    return EV[EV.length - 1];
  }

  function itemFor(key){
    return key === "evento" ? nextUpcomingEvent()
      : key === "home" ? HOME_ITEM
      : PAGE_ITEMS.filter(p => p.id === key)[0];
  }

  const navLinks = Array.prototype.slice.call(document.querySelectorAll(".topbar__nav a[data-target]"));
  navLinks.forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const key = a.dataset.target;
      const item = itemFor(key);
      if (item) goTo(item.f, true);
      else if (key !== "evento") location.href = "?ed=xiv#" + key;   /* página que no existe en esta edición */
    });
  });

  document.querySelectorAll(".edsel [data-ed]").forEach(a => {
    const on = a.dataset.ed === ED_KEY;
    a.setAttribute("aria-selected", String(on));
    if (on) a.setAttribute("aria-current", "page");
  });
  spine.setAttribute("aria-label", "Línea de tiempo de eventos " + ED.label);

  spine.setAttribute("aria-valuemin", "0");
  spine.setAttribute("aria-valuemax", "1000");

  resize();
  buildBrain();
  refreshFilter();
  if (todayIn) renderFlap(flapStr(todayMs));
  else if (EV.length) renderFlap(flapStr(EV[0].ms));
  io.observe(section);

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  const hashItem = location.hash ? itemFor(location.hash.slice(1)) : null;
  requestAnimationFrame(() => goTo(hashItem ? hashItem.f : (todayIn ? todayF : 0), false));
})();

</script>
</body>
</html>

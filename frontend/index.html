<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XIII JISIC 2026 — La IA transformando el mundo</title>
<link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./src/css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav__brand">
    <img class="brand-logo" src="./src/assets/images/logos/jisic-2027.png" alt="XIV Jornadas JISIC 2027" width="1808" height="679">
  </div>
  <div class="topbar__nav">
    <a href="#evento" data-target="evento">❰ evento ❱</a>
    <a href="#home" data-target="home" aria-current="page">Inicio</a>
    <a href="#comite" data-target="comite">Comité</a>
    <a href="#XIV_JISIC" data-target="XIV_JISIC">XIV JISIC</a>
  </div>
</nav>

<section class="ascent" id="ascent">
  <div class="ascent__sticky">
    <canvas class="bloom" id="bloom"></canvas>
    <canvas class="neuro" id="neuro" aria-hidden="true"></canvas>

    <!-- ============ CONTROLES ============ -->
    <div class="topbar">
      <form class="searchfield" id="agenda-form" role="search" autocomplete="off">
        <svg class="searchfield__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.1"/>
          <path d="M16.3 16.3 21 21" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
        </svg>
        <label class="sr-only" for="agenda-query" hidden>Buscar un evento</label>
        <input class="searchfield__input" id="agenda-query" name="q" type="search"
               placeholder="Buscar evento (ej. Neurociencia)…">
        <button class="searchfield__submit" id="agenda-submit" type="submit" aria-label="Ir al evento">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <p class="topbar__hint" id="agenda-hint" aria-live="polite">—</p>
      <ul class="legend" aria-label="Tipos de evento">
        <li class="cat cat--conferencia"><i aria-hidden="true"></i>Conferencias</li>
        <li class="cat cat--workshop"><i aria-hidden="true"></i>Workshops</li>
        <li class="cat cat--networking"><i aria-hidden="true"></i>Networking</li>
        <li class="cat cat--concurso"><i aria-hidden="true"></i>Concursos</li>
        <li class="cat cat--podcast"><i aria-hidden="true"></i>Podcast</li>
      </ul>
    </div>

    <div class="spine" id="spine" tabindex="0" role="slider"
         aria-label="Línea de tiempo de eventos JISIC 2026"
         aria-valuemin="1" aria-valuemax="365" aria-valuenow="1" aria-valuetext="">
      <div class="spine__rail" id="spineRail">
        <div class="spine__track"></div>
        <div class="spine__fill" id="spineFill"></div>
      </div>
      <div class="halo" id="halo"></div>
      <!-- Nodo viajero: icono JISIC centrado -->
      <div class="node" id="node" aria-hidden="true">
        <span class="node__grip"></span>
        <img src="./src/assets/icons/jisic-icon.svg" alt="">
      </div>
    </div>

    <footer class="site-foot">
      <a class="site-foot__logo" href="https://www.epn.edu.ec" target="_blank" rel="noopener"><img src="./src/assets/images/logos/epn.png" alt="Escuela Politécnica Nacional"><span>Escuela Politécnica<br>Nacional</span></a>
      <i class="site-foot__sep"></i>
      <a class="site-foot__logo" href="https://fis.epn.edu.ec" target="_blank" rel="noopener"><img src="./src/assets/images/logos/fis.png" alt="Facultad de Ingeniería de Sistemas"><span>Facultad de Ingeniería<br>de Sistemas</span></a>
      <i class="site-foot__sep"></i>
      <span class="site-foot__txt">Copyright © JISIC<br>
      pat_mic is cooking now...!</span>
    </footer>

    <div class="scrim"></div>

    <div class="stage" id="stage">
      <div class="countdown" id="countdown" role="timer" aria-label="Tiempo restante para el evento" hidden>
        <div class="countdown__box"><b id="cdWeeks">00</b><span>semanas</span></div>
        <div class="countdown__box"><b id="cdDays">00</b><span>días</span></div>
        <div class="countdown__box"><b id="cdHours">00</b><span>horas</span></div>
      </div>
      <div class="stage__cats" id="cats" hidden></div>
      <div class="counter" id="counter" role="status" aria-live="off"></div>
      <div class="stage__head">
        <p class="stage__eyebrow" id="eyebrow">—</p>
        <span class="chip" id="when">—</span>
      </div>
      <h2 class="stage__title reveal" id="title"><span>—</span></h2>
      <p class="stage__body reveal" id="body"><span>—</span></p>
      <div class="meta" id="meta"></div>
      <div class="stage__page" id="pageBox" hidden></div>
      <div class="ctl">
        <button type="button" id="btnPrev"><span aria-hidden="true">⟰</span>Anterior</button>
        <button type="button" id="btnToday" class="is-key">Hoy</button>
        <button type="button" id="btnNext">Siguiente<span aria-hidden="true">⟱</span></button>
      </div>
    </div>

    <div class="rail"><div class="rail__fill" id="railFill"></div></div>
  </div>
</section>

<script src="./src/js/main.js"></script>
</body>
</html>
